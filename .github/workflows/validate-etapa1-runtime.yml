name: Validar runtime Docker Etapa 1

on:
  push:
    branches:
      - chatgpt/etapa1-nginx-gzip-20261001

permissions:
  contents: read

jobs:
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t suiteena-runtime-test .

      - name: Arrancar contenedor
        run: |
          docker run -d --name suiteena-runtime             -e PORT=8080             -p 8080:8080             suiteena-runtime-test

      - name: Smoke test ping
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/ping | grep -qx 'ok'; then
              exit 0
            fi
            sleep 1
          done
          docker logs suiteena-runtime
          exit 1

      - name: Mostrar logs de arranque
        if: always()
        run: docker logs suiteena-runtime || true
