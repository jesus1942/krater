name: Reconstruir frontend Vue para Railway

on:
  push:
    branches: [claude/web-app-migration-laf9yy]
    paths:
      - '.github/workflows/rebuild-frontend-chatgpt.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/web-app-migration-laf9yy
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias legacy
        run: npm ci --legacy-peer-deps

      - name: Compilar frontend de produccion
        run: npm run production

      - name: Verificar que las rutas nuevas esten en el bundle
        run: |
          grep -q "academic-years" public/assets/js/app.js
          grep -q "Ciclos lectivos" public/assets/js/app.js

      - name: Actualizar frontend precompilado usado por Docker
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c -9 public/assets/js/app.js > /tmp/app.js.gz
          split -b 450k -d -a 2 /tmp/app.js.gz build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json

      - name: Guardar bundle actualizado y retirar workflow temporal
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add build/frontend
          git rm .github/workflows/rebuild-frontend-chatgpt.yml
          git commit -m "recompilar frontend con rutas academicas"
          git push origin HEAD:claude/web-app-migration-laf9yy
