name: Validar auditoria fila 3

on:
  push:
    branches:
      - chatgpt/auditoria-fila3-20261001

permissions:
  contents: write

jobs:
  validar:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/auditoria-fila3-20261001
          fetch-depth: 0

      - name: PHP 7.4 para suite legacy
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_mysql, zip, bcmath, gd
          coverage: none

      - name: Instalar dependencias PHP
        run: |
          composer config --global audit.block-insecure false || true
          composer install --no-interaction --prefer-dist --no-progress

      - name: Validar sintaxis PHP
        run: |
          php -l app/Services/Audit/Auditor.php
          php -l app/Http/Controllers/V1/Student/StudentRelocationController.php
          php -l app/Models/Invoice.php
          php -l app/Models/Estimate.php
          php -l app/Models/Payment.php
          php -l app/Models/Expense.php
          php -l app/Models/Student.php
          php -l app/Models/StaffMember.php
          php -l app/Models/PayrollSlip.php
          php -l app/Models/PayrollPayment.php
          php -l tests/Isolation/AuditExpansionTest.php

      - name: Tests de auditoria y regresion
        run: |
          vendor/bin/pest \
            tests/Isolation/AuditExpansionTest.php \
            tests/Isolation/StudentCoursePlacementTest.php \
            tests/Isolation/PayrollFoundationTest.php

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar frontend
        run: npm ci --legacy-peer-deps

      - name: Compilar Vue de produccion
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Regenerar bundle reproducible para Railway
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -d -a 2 -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
          test -s build/frontend/app.js.gz.part.00
          test -s build/frontend/mix-manifest.json

      - name: No versionar assets public generados
        run: |
          git checkout origin/claude/web-app-migration-laf9yy -- \
            public/assets/js/app.js \
            public/assets/css/crater.css \
            public/mix-manifest.json

      - name: Guardar bundle compilado
        run: |
          if git diff --quiet -- build/frontend public/assets/js/app.js public/assets/css/crater.css public/mix-manifest.json; then
            echo "Bundle sin cambios pendientes"
            exit 0
          fi
          git config user.name "Jesús Olguín"
          git config user.email "47510848+jesus1942@users.noreply.github.com"
          git add build/frontend public/assets/js/app.js public/assets/css/crater.css public/mix-manifest.json
          git commit -m "compilar formulario auditado de reubicacion [skip ci]"
          git push origin HEAD:chatgpt/auditoria-fila3-20261001
