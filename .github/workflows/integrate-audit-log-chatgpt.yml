name: Integrar bitacora de auditoria

on:
  push:
    branches:
      - chatgpt/bitacora-auditoria-20260816

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/bitacora-auditoria-20260816
          fetch-depth: 0

      - name: Crear backend y migracion de auditoria
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/Http/Controllers/V1/Audit app/Services/Audit app/Traits resources/assets/js/views/academic

          cat > database/migrations/2026_09_01_000500_create_audit_logs_table.php <<'PHP'
