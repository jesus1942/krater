name: Secure reports ChatGPT

on:
  push:
    branches:
      - chatgpt/reportes-seguros-nivel-20260816

permissions:
  contents: write

jobs:
  secure-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reportes-seguros-nivel-20260816
          fetch-depth: 0

      - name: Wire secure report tenant and frontend level
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kernel = Path('app/Http/Kernel.php')
          s = kernel.read_text()
          needle = "        'tenant' => \\Crater\\Http\\Middleware\\ValidateTenant::class,\n"
          replacement = needle + "        'report-tenant' => \\Crater\\Http\\Middleware\\ReportTenant::class,\n"
          if "'report-tenant'" not in s:
              if needle not in s:
                  raise SystemExit('Kernel tenant alias anchor not found')
              s = s.replace(needle, replacement, 1)
              kernel.write_text(s)

          routes = Path('routes/web.php')
          s = routes.read_text()
          old = "Route::prefix('reports')->group(function () {"
          new = "Route::prefix('reports')->middleware(['redirect-if-unauthenticated', 'report-tenant'])->group(function () {"
          if new not in s:
              if old not in s:
                  raise SystemExit('Reports route group anchor not found')
              s = s.replace(old, new, 1)
              routes.write_text(s)

          files = [
              Path('resources/assets/js/views/reports/SalesReports.vue'),
              Path('resources/assets/js/views/reports/ExpensesReport.vue'),
              Path('resources/assets/js/views/reports/ProfitLossReport.vue'),
              Path('resources/assets/js/views/reports/TaxReport.vue'),
          ]
          needle = "&to_date=${moment(this.formData.to_date).format(\n        'YYYY-MM-DD'\n      )}`"
          replacement = "&to_date=${moment(this.formData.to_date).format(\n        'YYYY-MM-DD'\n      )}&school_level_id=${window.Ls.get('selectedSchoolLevel') || ''}`"
          total = 0
          for p in files:
              s = p.read_text()
              if 'school_level_id=${window.Ls.get' in s:
                  continue
              count = s.count(needle)
              if count == 0:
                  raise SystemExit(f'Report URL anchor not found in {p}')
              total += count
              p.write_text(s.replace(needle, replacement))
          if total not in (0, 5):
              raise SystemExit(f'Expected 5 report URL replacements, got {total}')
          PY

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l app/Http/Middleware/ReportTenant.php
          php -l app/Http/Kernel.php
          php -l routes/web.php
          php -l tests/Isolation/ReportTenantSecurityTest.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run report security regression
        run: vendor/bin/pest tests/Isolation/ReportTenantSecurityTest.php

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend production bundle
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Verify report level is in compiled bundle
        run: |
          grep -q "school_level_id" public/assets/js/app.js
          grep -q "reports/sales/customers" public/assets/js/app.js

      - name: Refresh precompiled Railway frontend
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -d -a 2 -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json

      - name: Commit secure reports and self-delete workflow
        run: |
          git config user.name "Jesus Olguin"
          git config user.email "47510848+jesus1942@users.noreply.github.com"
          git add app/Http/Kernel.php routes/web.php \
                  resources/assets/js/views/reports/SalesReports.vue \
                  resources/assets/js/views/reports/ExpensesReport.vue \
                  resources/assets/js/views/reports/ProfitLossReport.vue \
                  resources/assets/js/views/reports/TaxReport.vue \
                  build/frontend
          git commit -m "Asegurar reportes por sesión permiso y nivel"
          rm .github/workflows/secure-reports-chatgpt.yml
          git add -u .github/workflows/secure-reports-chatgpt.yml
          git commit -m "Retirar workflow temporal de reportes"
          git push origin HEAD:chatgpt/reportes-seguros-nivel-20260816
