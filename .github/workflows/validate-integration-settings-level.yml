name: Validate integration settings by level
on:
  push:
    branches:
      - chatgpt/integration-settings-by-level-20260816
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/integration-settings-by-level-20260816
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Validate migration and structure
        run: |
          php -l database/migrations/2026_09_01_000900_scope_integration_settings_by_school_level.php
          grep -q "school_level_id" docs/INTEGRATION_SETTINGS_BY_LEVEL.md
          grep -q "secure_settings_level_unique" database/migrations/2026_09_01_000900_scope_integration_settings_by_school_level.php
      - name: Self delete workflow
        run: |
          git config user.name 'Jesus Olguin'
          git config user.email '47510848+jesus1942@users.noreply.github.com'
          git rm .github/workflows/validate-integration-settings-level.yml
          git commit -m 'Retirar validacion temporal de integraciones por nivel'
          git push origin HEAD:chatgpt/integration-settings-by-level-20260816
