name: Endurecer superadmin RBAC

on:
  push:
    branches:
      - chatgpt/usuarios-roles-20260816
    paths:
      - '.github/workflows/harden-superadmin-rbac.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/usuarios-roles-20260816
          fetch-depth: 0

      - name: Centralizar compatibilidad y jerarquia
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/Services/Access/AccessManager.php')
          s = p.read_text()

          old_doc = """     * Se consulta contra la tabla de roles, no contra `users.role`. La columna
     * heredada de Crater se mantiene por compatibilidad durante la migracion,
     * pero NO es fuente de verdad para autorizar.
"""
          new_doc = """     * La tabla RBAC es la fuente principal. Durante la migracion se conserva
     * un fallback estricto para `users.role = super admin`, que ya representa
     * administracion total en Crater y no debe perder autoridad por faltar una
     * fila de role_user.
"""
          if old_doc not in s:
              raise SystemExit('No se encontro el comentario esperado de isTotalAdmin')
          s = s.replace(old_doc, new_doc, 1)

          old_total = """        return Cache::remember(\"acl:u{$user->id}:total_admin\", self::CACHE_TTL, function () use ($user) {
            $today = now()->toDateString();

            return DB::table('role_user')
"""
          new_total = """        return Cache::remember(\"acl:u{$user->id}:total_admin\", self::CACHE_TTL, function () use ($user) {
            // Compatibilidad centralizada con el superadmin historico de Crater.
            // El valor es deliberadamente exacto para no ampliar privilegios.
            if ($user->role === 'super admin') {
                return true;
            }

            $today = now()->toDateString();

            return DB::table('role_user')
"""
          if old_total not in s:
              raise SystemExit('No se encontro isTotalAdmin esperado')
          s = s.replace(old_total, new_total, 1)

          old_hierarchy = """    public function hierarchyLevel(User $user): int
    {
        $today = now()->toDateString();
"""
          new_hierarchy = """    public function hierarchyLevel(User $user): int
    {
        // La administracion total ocupa siempre la cima, incluso cuando viene
        // del campo legacy y todavia no tiene una fila convencional role_user.
        if ($this->isTotalAdmin($user)) {
            return 0;
        }

        $today = now()->toDateString();
"""
          if old_hierarchy not in s:
              raise SystemExit('No se encontro hierarchyLevel esperado')
          s = s.replace(old_hierarchy, new_hierarchy, 1)

          old_manage = """        if ($this->isTotalAdmin($actor)) {
            return true;
        }

        return $this->hierarchyLevel($actor) < $this->hierarchyLevel($target);
"""
          new_manage = """        if ($this->isTotalAdmin($actor)) {
            return true;
        }

        // Fuera de la administracion total nunca se cruzan instituciones.
        if ((int) $actor->company_id !== (int) $target->company_id) {
            return false;
        }

        // Un total-admin no puede quedar administrable por un rol inferior aun
        // cuando su origen sea el campo legacy y no role_user.
        if ($this->isTotalAdmin($target)) {
            return false;
        }

        return $this->hierarchyLevel($actor) < $this->hierarchyLevel($target);
"""
          if old_manage not in s:
              raise SystemExit('No se encontro canManageUser esperado')
          s = s.replace(old_manage, new_manage, 1)
          p.write_text(s)

          p = Path('app/Http/Middleware/CheckPermission.php')
          s = p.read_text()
          legacy = """        // Puente de compatibilidad durante la migracion a RBAC. El middleware
        // admin heredado ya considera este valor administracion total, por lo
        // que no debe perder acceso a los modulos nuevos si role_user aun no
        // fue poblado correctamente.
        if ($user->role === 'super admin') {
            return $next($request);
        }

"""
          if legacy not in s:
              raise SystemExit('No se encontro bypass legacy en CheckPermission')
          p.write_text(s.replace(legacy, '', 1))

          p = Path('app/Providers/AuthServiceProvider.php')
          s = p.read_text()
          gate = """        // Compatibilidad con el superadmin heredado de Crater. El esquema
        // anterior ya le otorgaba administracion total; durante la migracion
        // a RBAC no debe quedar bloqueado porque falte una fila en role_user.
        Gate::before(function ($user) {
            if ($user->role === 'super admin') {
                return true;
            }

            return null;
        });

"""
          if gate not in s:
              raise SystemExit('No se encontro Gate::before temporal')
          p.write_text(s.replace(gate, '', 1))
          PY

      - name: Validar PHP y reglas de acceso
        run: |
          php -l app/Services/Access/AccessManager.php
          php -l app/Http/Middleware/CheckPermission.php
          php -l app/Providers/AuthServiceProvider.php
          php verificar-acceso.php

      - name: Guardar correccion y retirar workflow temporal
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add app/Services/Access/AccessManager.php app/Http/Middleware/CheckPermission.php app/Providers/AuthServiceProvider.php
          git rm .github/workflows/harden-superadmin-rbac.yml
          git commit -m "centralizar superadmin heredado en AccessManager"
          git push origin HEAD:chatgpt/usuarios-roles-20260816
