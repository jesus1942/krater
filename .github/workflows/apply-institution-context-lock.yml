name: Cerrar vista institucional

on:
  push:
    branches:
      - chatgpt/school-billing-canonical-20260816
    paths:
      - .github/workflows/apply-institution-context-lock.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/school-billing-canonical-20260816
          fetch-depth: 0

      - name: Autoría
        run: |
          git config user.name "Jesús Olguín"
          git config user.email "47510848+jesus1942@users.noreply.github.com"

      - name: Cerrar visibilidad institucional en frontend
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('resources/assets/js/views/settings/SettingsIndex.vue')
          s = p.read_text()
          old = """    visibleMenuItems() {\n      return this.menuItems.filter(\n        (item) => !item.totalAdminOnly || this.isTotalAdmin\n      )\n    },"""
          new = """    isWholeInstitutionContext() {\n      return !window.Ls.get('selectedSchoolLevel')\n    },\n    visibleMenuItems() {\n      return this.menuItems.filter(\n        (item) =>\n          !item.totalAdminOnly ||\n          (this.isTotalAdmin && this.isWholeInstitutionContext)\n      )\n    },"""
          if old not in s:
              raise SystemExit('No se encontro bloque SettingsIndex esperado')
          p.write_text(s.replace(old, new))

          p = Path('resources/assets/js/views/settings/SchoolLevelsSetting.vue')
          s = p.read_text()
          old = """  data() { return { levels: [], openId: null, loading: true, savingId: null } },\n  async created() { await this.load() },"""
          new = """  data() { return { levels: [], openId: null, loading: true, savingId: null } },\n  computed: {\n    isTotalAdmin() {\n      const currentUser = this.$store.state.user.currentUser\n      return Boolean(\n        currentUser &&\n          (currentUser.is_total_admin === true ||\n            currentUser.rbac_role === 'total_admin' ||\n            currentUser.role === 'super admin')\n      )\n    },\n    isWholeInstitutionContext() {\n      return !window.Ls.get('selectedSchoolLevel')\n    },\n  },\n  async created() {\n    if (!this.isTotalAdmin || !this.isWholeInstitutionContext) {\n      this.$router.replace('/admin/settings/user-profile')\n      return\n    }\n    await this.load()\n  },"""
          if old not in s:
              raise SystemExit('No se encontro bloque SchoolLevelsSetting esperado')
          p.write_text(s.replace(old, new))
          PY

          cat > tests/Isolation/InstitutionContextSecurityTest.php <<'PHP'
          <?php

          $root = dirname(__DIR__, 2);

          it('reserves the whole institution tenant context to total administration', function () use ($root) {
              $middleware = file_get_contents($root.'/app/Http/Middleware/ValidateTenant.php');
              expect($middleware)->toContain('if (! $isTotalAdmin)');
              expect($middleware)->toContain("'error' => 'school_level_required'");
          });

          it('hides whole institution from non total admins and forces a concrete allowed level', function () use ($root) {
              $header = file_get_contents($root.'/resources/assets/js/views/layouts/partials/TheSiteHeader.vue');
              expect($header)->toContain('<option v-if="isTotalAdmin" value="">Toda la institución</option>');
              expect($header)->toContain("window.Ls.set('selectedSchoolLevel', this.selectedLevelId)");
          });

          it('shows institutional levels settings only to total admin while viewing the whole institution', function () use ($root) {
              $settings = file_get_contents($root.'/resources/assets/js/views/settings/SettingsIndex.vue');
              $levels = file_get_contents($root.'/resources/assets/js/views/settings/SchoolLevelsSetting.vue');
              expect($settings)->toContain('this.isTotalAdmin && this.isWholeInstitutionContext');
              expect($levels)->toContain('!this.isTotalAdmin || !this.isWholeInstitutionContext');
          });

          it('keeps school level editing total-admin-only while allowing scoped level discovery for the header', function () use ($root) {
              $controller = file_get_contents($root.'/app/Http/Controllers/V1/Settings/SchoolLevelsController.php');
              expect($controller)->toContain('can_view_whole_institution');
              expect($controller)->toContain('isTotalAdmin($user)');
              expect($controller)->toContain('$this->authorizeTotalAdmin($request);');
              expect($controller)->toContain("DB::table('school_level_user')");
          });
          PHP

      - name: PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Sintaxis PHP
        run: |
          php -l app/Http/Controllers/V1/Settings/SchoolLevelsController.php
          php -l app/Http/Middleware/ValidateTenant.php
          php -l tests/Isolation/InstitutionContextSecurityTest.php

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Regresiones
        run: |
          vendor/bin/pest \
            tests/Isolation/InstitutionContextSecurityTest.php \
            tests/Isolation/StaffAndSchoolLevelSecurityTest.php \
            tests/Isolation/StaffOperationalTest.php \
            tests/Isolation/MobileFirstBillingTest.php \
            tests/Isolation/FamilyMembersCanonicalTest.php

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias frontend
        run: npm ci --legacy-peer-deps

      - name: Build Vue
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Bundle Railway
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -d -a 2 -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
          test -s build/frontend/app.js.gz.part.00

      - name: Limpiar aplicador y guardar corte
        run: |
          rm -f .github/workflows/apply-institution-context-lock.yml
          git add -A
          git commit -m "Reservar vista de toda la institución a total admin [skip ci]"
          git push origin chatgpt/school-billing-canonical-20260816
