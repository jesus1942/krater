name: Validar Etapa 1 fila 1

on:
  push:
    branches:
      - chatgpt/etapa1-fila1-20260930

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 7.4 para suite legacy
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite, pdo_mysql, zip, bcmath, gd
          coverage: none

      - name: Instalar dependencias
        run: |
          composer config --global audit.block-insecure false || true
          composer install --no-interaction --prefer-dist --no-progress

      - name: Validar sintaxis y configuracion de plataforma
        run: |
          php -l app/Console/Commands/ResetApp.php
          php -l tests/Feature/ResetAppSafetyTest.php
          sh -n start.sh
          ! grep -q '^startCommand' railway.toml
          grep -Fq 'CMD ["/var/www/start.sh"]' Dockerfile
          grep -Fq 'healthcheckPath = "/ping"' railway.toml

      - name: Test de seguridad reset app
        run: vendor/bin/phpunit tests/Feature/ResetAppSafetyTest.php
