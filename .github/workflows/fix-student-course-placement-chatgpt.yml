name: Fix student course placement ChatGPT
on:
  push:
    branches:
      - chatgpt/student-course-placement-20260816
permissions:
  contents: write
jobs:
  fix-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/student-course-placement-20260816
          fetch-depth: 0
      - name: Apply canonical student placement
        run: python3 .github/scripts/fix_student_course.py
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, sqlite3, pdo_sqlite
          tools: composer:v2
      - name: Validate PHP syntax and invariants
        run: |
          php -l app/Http/Controllers/V1/Student/StudentsController.php
          php -l app/Http/Requests/StudentRequest.php
          php -l database/migrations/2026_09_01_000800_repair_student_level_consistency.php
          php -l tests/Isolation/StudentCoursePlacementTest.php
          ! grep -Fq "school_level_id'] = \$request->header('school-level')" app/Http/Controllers/V1/Student/StudentsController.php
          grep -Fq "applyCanonicalPlacement" app/Http/Controllers/V1/Student/StudentsController.php
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run placement regressions
        run: ./vendor/bin/pest tests/Isolation/StudentCoursePlacementTest.php
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Build production frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci --legacy-peer-deps
          npm run production
          grep -q 'Seleccionar curso' public/assets/js/app.js
          grep -q 'placement-options' public/assets/js/app.js
      - name: Refresh Railway frontend bundle
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -b 450K -d -a 2 - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
      - name: Commit fix and self-delete workflow
        run: |
          git config user.name 'Jesus Olguin'
          git config user.email '47510848+jesus1942@users.noreply.github.com'
          git add app/Http/Controllers/V1/Student/StudentsController.php app/Http/Requests/StudentRequest.php routes/api.php database/migrations/2026_09_01_000800_repair_student_level_consistency.php resources/assets/js/views/students/Index.vue tests/Isolation/StudentCoursePlacementTest.php build/frontend
          git commit -m 'Vincular alumnos a cursos y divisiones canonicos'
          git rm .github/workflows/fix-student-course-placement-chatgpt.yml .github/scripts/fix_student_course.py
          git commit -m 'Retirar automatizacion temporal de ubicacion academica'
          git push origin HEAD:chatgpt/student-course-placement-20260816
