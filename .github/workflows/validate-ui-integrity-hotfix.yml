name: Validate UI integrity hotfix

on:
  push:
    branches:
      - chatgpt/ui-integrity-hotfix-20260816

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/ui-integrity-hotfix-20260816
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
      - name: Apply UI hotfix
        run: python3 .github/scripts/apply_ui_integrity_hotfix.py
      - name: PHP lint
        run: |
          php -l app/Http/Controllers/V1/Student/StudentsController.php
          php -l app/Http/Controllers/V1/Student/StudentRelocationController.php
          php -l database/migrations/2026_09_01_001000_seed_usable_academic_structure.php
          php -l routes/api.php
      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Run targeted tests
        run: |
          ./vendor/bin/pest tests/Isolation/StudentCoursePlacementTest.php tests/Isolation/UsableAcademicStructureTest.php
      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: |
          npm ci --legacy-peer-deps
          npm run production
          grep -q 'Todos los niveles · administración' public/assets/js/app.js
          grep -q 'Reubicar alumno' public/assets/js/app.js
      - name: Refresh Railway frontend bundle
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -b 450K -d -a 2 - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
      - name: Commit generated changes
        run: |
          git config user.name 'jesus1942'
          git config user.email '47510848+jesus1942@users.noreply.github.com'
          git add routes/api.php resources/assets/js/views/students/Index.vue build/frontend
          git commit -m 'Conectar reubicación y vista institucional de alumnos' || true
          git push origin HEAD:chatgpt/ui-integrity-hotfix-20260816
      - name: Self delete workflow
        if: always()
        run: |
          git pull --rebase origin chatgpt/ui-integrity-hotfix-20260816 || true
          git rm -f .github/workflows/validate-ui-integrity-hotfix.yml .github/scripts/apply_ui_integrity_hotfix.py
          git commit -m 'Retirar workflow temporal de validación' || true
          git push origin HEAD:chatgpt/ui-integrity-hotfix-20260816 || true
