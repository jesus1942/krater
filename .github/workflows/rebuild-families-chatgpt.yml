name: Rebuild families frontend ChatGPT

on:
  push:
    branches:
      - chatgpt/familias-responsables-20260816
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[skip rebuild]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: PHP syntax
        run: |
          php -l app/Models/FamilyMember.php
          php -l app/Models/Student.php
          php -l app/Http/Requests/StudentRequest.php
          php -l app/Http/Controllers/V1/Student/StudentsController.php
          php -l database/migrations/2026_09_01_000600_create_student_family_tables.php

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend dependencies
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm ci --legacy-peer-deps

      - name: Compile production frontend
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Verify families bundle
        run: |
          grep -q "Familia y responsables" public/assets/js/app.js
          grep -q "family_members" public/assets/js/app.js
          grep -q "Responsable financiero" public/assets/js/app.js

      - name: Refresh committed frontend bundle
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json

      - name: Commit bundle and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build/frontend
          git rm .github/workflows/rebuild-families-chatgpt.yml
          git commit -m "Recompilar frontend de familias y responsables [skip rebuild]"
          git push
