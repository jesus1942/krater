name: Reconstruir estructura academica para Railway

on:
  push:
    branches: [chatgpt/estructura-academica-20260816]
    paths:
      - '.github/workflows/rebuild-academic-structure-chatgpt.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --openssl-legacy-provider
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/estructura-academica-20260816
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias legacy
        run: npm ci --legacy-peer-deps

      - name: Compilar frontend de produccion
        run: npm run production

      - name: Verificar estructura academica en el bundle
        run: |
          grep -q "academic-structure" public/assets/js/app.js
          grep -q "Estructura académica" public/assets/js/app.js
          grep -q "/api/v1/subjects" public/assets/js/app.js

      - name: Actualizar frontend precompilado usado por Docker
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c -9 public/assets/js/app.js > /tmp/app.js.gz
          split -b 450k -d -a 2 /tmp/app.js.gz build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json

      - name: Guardar bundle y retirar workflow temporal
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"
          git add build/frontend
          git rm .github/workflows/rebuild-academic-structure-chatgpt.yml
          git commit -m "recompilar frontend con estructura academica"
          git push origin HEAD:chatgpt/estructura-academica-20260816
