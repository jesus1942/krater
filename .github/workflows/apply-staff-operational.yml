name: Cerrar Personal operativo

on:
  push:
    branches:
      - chatgpt/school-billing-canonical-20260816
    paths:
      - .github/workflows/apply-staff-operational.yml

permissions:
  contents: write

jobs:
  apply-test-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/school-billing-canonical-20260816
          fetch-depth: 0

      - name: Autoría
        run: |
          git config user.name 'Jesús Olguín'
          git config user.email '47510848+jesus1942@users.noreply.github.com'

      - name: Aplicar módulo operativo
        run: python3 scripts/apply_staff_operational.py

      - name: PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Sintaxis PHP
        run: |
          php -l app/Http/Controllers/V1/Staff/StaffMembersController.php
          php -l tests/Isolation/StaffOperationalTest.php
          php -l database/migrations/2026_09_01_001200_create_staff_foundation.php

      - name: Composer
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Regresiones
        run: |
          vendor/bin/pest \
            tests/Isolation/StaffOperationalTest.php \
            tests/Isolation/StaffAndSchoolLevelSecurityTest.php \
            tests/Isolation/MobileFirstBillingTest.php \
            tests/Isolation/ItemSchoolLevelIsolationTest.php \
            tests/Isolation/FamilyMembersCanonicalTest.php

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias frontend
        run: npm ci --legacy-peer-deps

      - name: Build Vue
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Bundle Railway
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -d -a 2 -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
          test -s build/frontend/app.js.gz.part.00
          test -s build/frontend/mix-manifest.json

      - name: Limpiar aplicador y guardar corte
        run: |
          rm -f scripts/apply_staff_operational.py .github/workflows/apply-staff-operational.yml
          git add -A
          git diff --cached --check
          git commit -m 'Completar módulo operativo de Personal [skip ci]'
          git push origin HEAD:chatgpt/school-billing-canonical-20260816
