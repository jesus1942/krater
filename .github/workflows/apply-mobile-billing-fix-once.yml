name: Aplicar corrección final de facturación móvil

on:
  push:
    branches:
      - chatgpt/school-billing-canonical-20260816

permissions:
  contents: write

jobs:
  fix-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/school-billing-canonical-20260816
          fetch-depth: 0

      - name: Reparar payload escolar y layout
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'No se encontró bloque esperado: {label}')
              return text.replace(old, new, 1)

          path = Path('resources/assets/js/views/invoices/Create.vue')
          s = path.read_text()
          s = replace_once(s,
              "        user_id: this.newInvoice.user_id || null,\n        student_id: this.newInvoice.student_id,\n        enrollment_id: this.newInvoice.enrollment_id || null,\n        family_member_id: this.newInvoice.family_member_id,\n        invoice_template_id: 1,",
              "        user_id: null,\n        student_id: null,\n        enrollment_id: null,\n        family_member_id: null,\n        invoice_template_id: 1,",
              'estado inicial')
          s = replace_once(s,
              "      let data = {\n        ...this.formData,\n        ...this.newInvoice,\n        sub_total: this.subtotal,\n        total: this.total,\n        tax: this.totalTax,\n        user_id: null,\n        student_id: null,\n        enrollment_id: null,\n        family_member_id: null,\n        template_name: this.getTemplateName,\n      }\n",
              "      let data = {\n        ...this.formData,\n        ...this.newInvoice,\n        sub_total: this.subtotal,\n        total: this.total,\n        tax: this.totalTax,\n        user_id: this.newInvoice.user_id || null,\n        student_id: this.newInvoice.student_id,\n        enrollment_id: this.newInvoice.enrollment_id || null,\n        family_member_id: this.newInvoice.family_member_id,\n        template_name: this.getTemplateName,\n      }\n",
              'submit escolar')
          s = replace_once(s,
              '<colgroup>\n          <col style="width: 40%" />',
              '<colgroup class="hidden md:table-column-group">\n          <col style="width: 40%" />',
              'colgroup responsive')
          path.write_text(s)
          PY

      - name: PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Probar facturación, tenant y familia
        run: |
          vendor/bin/pest \
            tests/Isolation/MobileFirstBillingTest.php \
            tests/Isolation/ItemSchoolLevelIsolationTest.php \
            tests/Isolation/FamilyMembersCanonicalTest.php \
            tests/Isolation/StaffAndSchoolLevelSecurityTest.php

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar frontend
        run: npm ci --legacy-peer-deps

      - name: Compilar Vue producción
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Regenerar bundle Railway
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -d -a 2 -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
          test -s build/frontend/app.js.gz.part.00
          test -s build/frontend/mix-manifest.json

      - name: Guardar sólo si todo está verde
        run: |
          rm .github/workflows/apply-mobile-billing-fix-once.yml
          git config user.name "Jesús Olguín"
          git config user.email "47510848+jesus1942@users.noreply.github.com"
          git add resources/assets/js/views/invoices/Create.vue build/frontend .github/workflows/apply-mobile-billing-fix-once.yml
          git commit -m "Corregir guardado escolar y mobile-first [skip ci]"
          git push origin HEAD:chatgpt/school-billing-canonical-20260816
