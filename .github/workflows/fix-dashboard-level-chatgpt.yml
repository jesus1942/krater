name: Fix dashboard level ChatGPT

on:
  push:
    branches:
      - chatgpt/dashboard-nivel-20260816

permissions:
  contents: write

jobs:
  test-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: chatgpt/dashboard-nivel-20260816

      - name: Add tenant middleware to dashboard controllers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'app/Http/Controllers/V1/Dashboard/DashboardController.php',
              'app/Http/Controllers/V1/Dashboard/DashboardChartController.php',
          ]:
              p = Path(name)
              s = p.read_text()
              if "$this->middleware('tenant')" in s:
                  continue
              marker = 'class ' + p.stem + ' extends Controller\n{\n'
              if marker not in s:
                  raise SystemExit(f'class anchor not found: {name}')
              s = s.replace(marker, marker + "    public function __construct()\n    {\n        $this->middleware('tenant');\n    }\n\n", 1)
              p.write_text(s)
          PY

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l app/Http/Controllers/V1/Dashboard/DashboardController.php
          php -l app/Http/Controllers/V1/Dashboard/DashboardChartController.php
          php -l tests/Isolation/DashboardSchoolLevelIsolationTest.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run dashboard regression
        run: vendor/bin/pest tests/Isolation/DashboardSchoolLevelIsolationTest.php

      - name: Commit fix and self-delete workflow
        run: |
          git config user.name "Jesus Olguin"
          git config user.email "47510848+jesus1942@users.noreply.github.com"
          git add app/Http/Controllers/V1/Dashboard/DashboardController.php \
                  app/Http/Controllers/V1/Dashboard/DashboardChartController.php
          git commit -m "Aislar métricas del dashboard por nivel"
          rm .github/workflows/fix-dashboard-level-chatgpt.yml
          git add -u .github/workflows/fix-dashboard-level-chatgpt.yml
          git commit -m "Retirar workflow temporal del dashboard"
          git push origin HEAD:chatgpt/dashboard-nivel-20260816
