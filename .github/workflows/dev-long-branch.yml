name: Validar rama larga SuiteEna

on:
  push:
    branches:
      - chatgpt/school-billing-canonical-20260816

permissions:
  contents: write

jobs:
  validate-build:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rama larga
        uses: actions/checkout@v4
        with:
          ref: chatgpt/school-billing-canonical-20260816
          fetch-depth: 0

      - name: PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Validar sintaxis PHP del corte
        run: |
          php -l app/Http/Controllers/V1/Settings/SchoolLevelsController.php
          php -l app/Models/StaffMember.php
          php -l app/Models/StaffAssignment.php
          php -l database/migrations/2026_09_01_001200_create_staff_foundation.php
          php -l tests/Isolation/StaffAndSchoolLevelSecurityTest.php
          php -l tests/Isolation/MobileFirstBillingTest.php
          php -l app/Http/Controllers/V1/Staff/PayrollController.php
          php -l app/Models/PayrollPeriod.php
          php -l app/Models/PayrollSlip.php
          php -l app/Models/PayrollPayment.php
          php -l database/migrations/2026_09_01_001300_create_payroll_foundation.php
          php -l tests/Isolation/PayrollFoundationTest.php

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Regresiones de corte
        run: |
          vendor/bin/pest \
            tests/Isolation/MobileFirstBillingTest.php \
            tests/Isolation/ItemSchoolLevelIsolationTest.php \
            tests/Isolation/FamilyMembersCanonicalTest.php \
            tests/Isolation/StaffAndSchoolLevelSecurityTest.php \
            tests/Isolation/PayrollFoundationTest.php

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar frontend
        run: npm ci --legacy-peer-deps

      - name: Compilar Vue de producción
        env:
          NODE_OPTIONS: --openssl-legacy-provider
        run: npm run production

      - name: Regenerar bundle reproducible para Railway
        run: |
          rm -f build/frontend/app.js.gz.part.*
          gzip -c public/assets/js/app.js | split -d -a 2 -b 450K - build/frontend/app.js.gz.part.
          cp public/assets/css/crater.css build/frontend/crater.css
          cp public/mix-manifest.json build/frontend/mix-manifest.json
          test -s build/frontend/app.js.gz.part.00
          test -s build/frontend/mix-manifest.json

      - name: No versionar assets public generados
        run: |
          git checkout origin/claude/web-app-migration-laf9yy -- \
            public/assets/js/app.js \
            public/assets/css/crater.css \
            public/mix-manifest.json

      - name: Guardar bundle compilado
        run: |
          if git diff --quiet -- build/frontend public/assets/js/app.js public/assets/css/crater.css public/mix-manifest.json; then
            echo "Bundle y artefactos sin cambios pendientes"
            exit 0
          fi
          git config user.name "Jesús Olguín"
          git config user.email "47510848+jesus1942@users.noreply.github.com"
          git add build/frontend public/assets/js/app.js public/assets/css/crater.css public/mix-manifest.json
          git commit -m "build: normalizar frontend SuiteEna [skip ci]"
          git push origin HEAD:chatgpt/school-billing-canonical-20260816
