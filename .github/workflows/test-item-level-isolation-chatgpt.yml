name: Test item school-level isolation ChatGPT

on:
  push:
    branches:
      - chatgpt/aislar-items-por-nivel-20260816

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 7.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l app/Http/Controllers/V1/Item/ItemsController.php
          php -l database/migrations/2026_09_01_000700_add_school_level_to_items.php
          php -l tests/Feature/ItemSchoolLevelIsolationTest.php

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run item level isolation regression
        run: vendor/bin/pest tests/Feature/ItemSchoolLevelIsolationTest.php
