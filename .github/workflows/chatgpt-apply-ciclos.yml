name: Aplicar y validar parche academico

on:
  push:
    branches: [chatgpt/ciclos-estructura-20260816]
    paths:
      - '.github/workflows/chatgpt-apply-ciclos.yml'
      - '.chatgpt/claude_ciclos.patch.gz.b64'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chatgpt/ciclos-estructura-20260816

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - name: Configurar Git
        run: |
          git config user.name "ChatGPT"
          git config user.email "noreply@openai.com"

      - name: Aplicar los dos commits de Claude
        run: |
          base64 -d .chatgpt/claude_ciclos.patch.gz.b64 | gzip -d > /tmp/ciclos.patch
          git am --3way /tmp/ciclos.patch

      - name: Endurecer tenant y normalizar alcances
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/Http/Requests/Academic/DivisionRequest.php')
          s = p.read_text()
          s = s.replace('use Illuminate\\Foundation\\Http\\FormRequest;\n', 'use Crater\\Support\\TenantContext;\nuse Illuminate\\Foundation\\Http\\FormRequest;\n')
          s = s.replace("        $id = optional($this->route('division'))->id;\n\n        return [\n            'academic_year_id' => ['required', 'integer', 'exists:academic_years,id'],\n            'grade_level_id' => ['required', 'integer', 'exists:grade_levels,id'],", "        $id = optional($this->route('division'))->id;\n        $companyId = TenantContext::companyId();\n        $schoolLevelId = TenantContext::schoolLevelId();\n\n        return [\n            'academic_year_id' => [\n                'required',\n                'integer',\n                Rule::exists('academic_years', 'id')->where(fn ($q) => $q\n                    ->where('company_id', $companyId)\n                    ->where('school_level_id', $schoolLevelId)),\n            ],\n            'grade_level_id' => [\n                'required',\n                'integer',\n                Rule::exists('grade_levels', 'id')->where(fn ($q) => $q\n                    ->where('company_id', $companyId)\n                    ->where('school_level_id', $schoolLevelId)),\n            ],")
          s = s.replace("                        ->where('academic_year_id', $this->academic_year_id)\n                        ->where('grade_level_id', $this->grade_level_id))", "                        ->where('company_id', $companyId)\n                        ->where('school_level_id', $schoolLevelId)\n                        ->where('academic_year_id', $this->academic_year_id)\n                        ->where('grade_level_id', $this->grade_level_id))")
          s = s.replace("            'head_teacher_id' => ['nullable', 'integer', 'exists:users,id'],", "            'head_teacher_id' => [\n                'nullable',\n                'integer',\n                Rule::exists('users', 'id')->where(fn ($q) => $q->where('company_id', $companyId)),\n            ],")
          p.write_text(s)

          p = Path('app/Http/Controllers/V1/Academic/GradeLevelsController.php')
          s = p.read_text()
          s = s.replace("                Rule::unique('grade_levels')\n                    ->where(fn ($q) => $q->where('school_level_id', $request->header('school-level')))\n                    ->ignore(optional($actual)->id),", "                Rule::unique('grade_levels')\n                    ->where(fn ($q) => $q\n                        ->where('company_id', TenantContext::companyId())\n                        ->where('school_level_id', TenantContext::schoolLevelId()))\n                    ->ignore(optional($actual)->id),")
          s = s.replace("            'promotes_to_id' => ['nullable', 'integer', 'exists:grade_levels,id'],", "            'promotes_to_id' => [\n                'nullable',\n                'integer',\n                Rule::exists('grade_levels', 'id')->where(fn ($q) => $q\n                    ->where('company_id', TenantContext::companyId())\n                    ->where('school_level_id', TenantContext::schoolLevelId())),\n            ],")
          p.write_text(s)

          p = Path('app/Services/Access/AccessManager.php')
          s = p.read_text()
          s = s.replace("        return $directas->merge($porSeccion)->unique()->values()->all();", "        return $directas\n            ->merge($porSeccion)\n            ->map(fn ($id) => (int) $id)\n            ->unique()\n            ->values()\n            ->all();")
          p.write_text(s)
          PY

      - name: Dejar informe para Claude
        run: |
          cat > CORRECCIONES_CHATGPT_CICLOS.md <<'EOF'
          # Correcciones sobre `pantallaciclosyestructura.patch`

          Se aplicaron los dos commits de Claude y se endurecieron antes de produccion.

          ## Correcciones realizadas
          - `academic_year_id`: limitado a empresa y nivel actuales.
          - `grade_level_id`: limitado a empresa y nivel actuales.
          - `head_teacher_id`: limitado a la empresa actual.
          - Unicidad de `Division.name`: incluye empresa y nivel, ademas de ciclo y curso.
          - `promotes_to_id`: limitado a empresa y nivel actuales.
          - Unicidad de `GradeLevel.position`: usa `TenantContext`, no el header crudo.
          - Se conserva el filtro por empresa de `scopedDivisionIds()` agregado por Claude.
          - `scopedDivisionIds()` normaliza los IDs a `int`; SQLite puede devolver `pluck()` como strings y eso rompia comparaciones estrictas del banco de pruebas. La normalizacion deja el contrato del metodo estable entre motores.

          ## Validacion
          - Dependencias instaladas con PHP 7.4, compatible con el lock legacy del proyecto.
          - `php -l` sobre controladores/request nuevos y `AccessManager.php`.
          - Chequeo estatico para impedir `exists:` crudos en estas referencias academicas.
          - `php verificar-acceso.php`, incluyendo alcance fino y aislamiento entre instituciones.

          ## Regla para cambios futuros
          En estructura academica multi-tenant, usar `Rule::exists/unique(...)->where(...)` con `company_id` y, cuando corresponda, `school_level_id` obtenidos desde `TenantContext`.
          EOF

      - name: Instalar dependencias PHP
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validar sintaxis y aislamiento
        run: |
          php -l app/Http/Controllers/V1/Academic/DivisionsController.php
          php -l app/Http/Controllers/V1/Academic/GradeLevelsController.php
          php -l app/Http/Requests/Academic/DivisionRequest.php
          php -l app/Services/Access/AccessManager.php
          ! grep -R "exists:academic_years,id\|exists:grade_levels,id\|exists:users,id" app/Http/Requests/Academic/DivisionRequest.php app/Http/Controllers/V1/Academic/GradeLevelsController.php
          php verificar-acceso.php

      - name: Commit de endurecimiento
        run: |
          git add app/Http/Requests/Academic/DivisionRequest.php app/Http/Controllers/V1/Academic/GradeLevelsController.php app/Services/Access/AccessManager.php CORRECCIONES_CHATGPT_CICLOS.md
          git commit -m "cerrar referencias cruzadas entre instituciones"

      - name: Retirar archivos auxiliares
        run: |
          git rm .chatgpt/claude_ciclos.patch.gz.b64 .github/workflows/chatgpt-apply-ciclos.yml
          git commit -m "retirar automatizacion temporal del parche"

      - name: Empujar rama validada
        run: git push origin HEAD:chatgpt/ciclos-estructura-20260816
