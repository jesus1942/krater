[build]
builder = "dockerfile"

[deploy]
preDeployCommand = "php artisan migrate --force && php artisan db:seed --class=Database\\\\Seeders\\\\RbacSeeder --force && php artisan crater:mark-installed"
healthcheckPath = "/ping"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
